name: Prepare complete site preview
on:
  push:
    branches: [complete-site-20260923]
    paths: [.github/workflows/prepare-complete-site.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-site-20260923
      - name: Assemble and validate source
        run: |
          python tools/review-fixes.py
          python tools/build-site.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('assets/portraits.webp')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d8c0c528fb725505cb31f1b6f5905986cd8f0d5732348b57b37f1c1c62432a8e'
          p=Path('assets/site.css');s=p.read_text();extra='\n/* Long German words and example addresses stay inside narrow screens. */\n.kl-site h1,.kl-site h2,.kl-site h3,.kl-site .kl-floor-name,.kl-site dd,.kl-site .kl-form-result{overflow-wrap:anywhere;hyphens:auto}\n'
          if extra not in s:p.write_text(s+extra)
          PY
          node --check assets/site.js
          node --check assets/site-content.js
          node --check assets/site-data.js
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: python tools/test-site.py
      - name: Commit reviewed files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.html our-firm.html floors.html lawyers.html client-guide.html insights.html legal.html contact.html SITE-PLAN.md
          git diff --cached --quiet || git commit -m 'Verify bilingual interactive site and responsive layouts'
          git push origin HEAD:complete-site-20260923
      - name: Export review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronberg-complete-preview
          path: |
            *.html
            *.png
            *.js
            assets/
            SITE-PLAN.md
            review-results/
          retention-days: 3
